name: Build Turbo Kart Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "Using pre-installed Android SDK at $ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_HOME/tools/bin" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Download Godot Engine & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      - name: Configure Android Keystore
        run: |
          mkdir -p build godot_project/build
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > godot_project/build/release.keystore
            cp godot_project/build/release.keystore build/release.keystore
          else
            echo "Generating debug keystore for APK signing..."
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore godot_project/build/debug.keystore \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000 -deststoretype pkcs12
            cp godot_project/build/debug.keystore build/debug.keystore
          fi

      - name: Configure Godot Editor Settings for Android Export
        run: |
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '' >> ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/godot_project/build/debug.keystore\"" >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_password = "android"' >> ~/.config/godot/editor_settings-4.tres

      - name: Export Godot Android APK
        run: |
          cd godot_project
          # Initialize project in headless mode
          godot --headless --editor --quit || true
          # Export Android APK
          godot --headless --export-debug "Android" build/TurboKart.apk || true

      - name: Build Native Android APK with Gradle
        run: |
          # Build native Android APK as backup and direct high-performance version
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

          mkdir -p build
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build/TurboKart-Native.apk
            if [ ! -f "godot_project/build/TurboKart.apk" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk build/TurboKart.apk
            else
              cp godot_project/build/TurboKart.apk build/TurboKart.apk
            fi
          fi

      - name: Verify APK Output
        run: |
          echo "Listing generated APK files:"
          ls -lh build/ || true
          ls -lh godot_project/build/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboKart-APK
          path: |
            build/*.apk
            godot_project/build/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.apk
            godot_project/build/*.apk
          name: "Turbo Kart ${{ github.ref_name }}"
          body: |
            # 🏎️ טורבו קארט — גרסה ${{ github.ref_name }}
            
            משחק מרוצים תלת־ממדי מקצועי לאנדרואיד:
            - 20 מכוניות קארט ייחודיות ושדרוגים
            - 36 מסלולים מרהיבים ב-12 עולמות
            - 10 כוחות מיוחדים (טורבו, מגן, קרח, טילים ועוד)
            - יריבי AI חכמים
            - עורך מסלולים אינטראקטיבי
            - ממשק מלא בעברית (Landscape)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
